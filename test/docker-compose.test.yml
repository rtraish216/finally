# E2E test stack: the app (mock LLM, fresh database) plus a Playwright runner.
# Run from the repo root:
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
# Playwright image tag must match the @playwright/test version in test/package.json;
# override with PLAYWRIGHT_IMAGE if it changes.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      FINALLY_DB_PATH: /app/db/finally.db
    volumes:
      - test-db:/app/db        # fresh named volume; removed by `down -v`
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  playwright:
    image: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.58.2-noble}
    working_dir: /work
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
      CI: "true"
    volumes:
      - ./:/work
      - playwright-node-modules:/work/node_modules
    ipc: host
    command: ["sh", "-c", "npm ci && npx playwright test"]

volumes:
  test-db:
  playwright-node-modules:
